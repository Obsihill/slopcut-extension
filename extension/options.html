<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>딸깍컷 - 차단 목록 관리</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/slopcut.svg">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <header class="titlebar">
    <img src="icons/icon-16.png" width="16" height="16" alt="">
    <h1 id="brand-title">딸깍컷 - 차단 목록 관리</h1>
  </header>
  <div class="toolbar">
    <label><input id="enabled" type="checkbox">상품 숨기기</label>
    <span class="separator" aria-hidden="true"></span>
    <span id="site-controls" style="display:contents"></span>
    <label class="theme-control">테마 <select id="theme"><option value="system">브라우저 설정</option><option value="light">라이트</option><option value="dark">다크</option></select></label>
  </div>
  <section class="add-panel" aria-labelledby="add-title">
    <h2 id="add-title">판매자 직접 추가</h2>
    <form id="add" class="fields">
      <label>사이트 <select id="add-site"></select></label>
      <label class="publisher-field">URL / ID <input id="publisher" required placeholder="https://assetstore.unity.com/publishers/12345" autocomplete="off"></label>
      <label>이름 <input id="name" placeholder="선택 입력" maxlength="200" autocomplete="off"></label>
      <button type="submit">차단 추가</button>
    </form>
  </section>
  <section class="list-panel" aria-labelledby="list-title">
    <div class="list-toolbar">
      <h2 id="list-title">차단 목록 <span id="count">0<span>명</span></span></h2>
      <div class="list-controls">
        <select id="site-filter" aria-label="차단 목록 사이트"><option value="">전체 사이트</option></select>
        <input id="search" type="search" aria-label="차단 목록 검색" placeholder="이름 / ID 검색">
      </div>
    </div>
    <div class="list-view">
      <div class="column-heading" aria-hidden="true"><span>판매자</span><span>사이트 / ID / 추가일</span><span>관리</span></div>
      <div id="empty" class="empty">아직 차단한 판매자가 없습니다.</div>
      <ul id="list" aria-label="차단한 판매자"></ul>
    </div>
  </section>
  <div class="tools">
    <button id="export">백업 내보내기</button>
    <button id="import">백업 가져오기</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <button id="clear">전체 해제</button>
    <span id="message" role="status" aria-live="polite"></span>
  </div>
  <footer>차단 목록은 이 브라우저에 저장됩니다.</footer>
</main>
<script src="shared.js"></script>
<script src="options.js"></script>
</body>
</html>
